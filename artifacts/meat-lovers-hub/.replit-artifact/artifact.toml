kind = "web"
previewPath = "/"
title = "Meat Lovers Hub"
version = "1.0.0"
id = "artifacts/meat-lovers-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21111

[services.development]
run = "pnpm --filter @workspace/meat-lovers-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/meat-lovers-hub", "run", "build" ]
publicDir = "artifacts/meat-lovers-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21111"
BASE_PATH = "/"
